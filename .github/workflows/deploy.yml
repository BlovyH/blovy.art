name: Deploy to GitHub Pages

#   push:
#     branches: [dev]
on:
  workflow_dispatch:
    inputs:
      ref:
        description: '要构建部署的分支'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # wrangler 要求 >= 22，否则构建报错 Wrangler requires at least Node.js v22.0.0. You are using v20.20.2. Please update your version of Node.js.
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      # 归档失败不阻塞发布，漏了 map 只是这条构建的堆栈解不出来
      - name: Archive sourcemaps
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for f in $(ls dist/assets/*.map 2>/dev/null); do
            npx wrangler r2 object put "blovy-logs/maps/$(basename "$f")" --file "$f" --remote
          done

      # 线上不挂 .map，传完 r2 移除掉
      - name: Strip sourcemaps
        run: rm -f dist/assets/*.map

      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
